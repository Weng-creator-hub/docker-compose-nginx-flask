name: Backend Demo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  compose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for application health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:8080/health; then
              exit 0
            fi

            echo "Waiting for application: ${attempt}/30"
            sleep 2
          done

          echo "Application did not become healthy in time"
          exit 1

       - name: Publish tested backend image
         if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
         env:
           GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: |
           image_ref="ghcr.io/weng-creator-hub/docker-compose-nginx-flask:sha-${GITHUB_SHA}"
          
           printf '%s' "$GHCR_TOKEN" |
             docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

           docker tag my-api:latest "$image_ref"
           docker push "$image_ref"     - name: Show container status
        
      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans
